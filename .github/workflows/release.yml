name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v prefix (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # windows-latest is VS 2026 (generator "Visual Studio 18 2026").
    # Pin to windows-2022 for the VS 17 / CMake 3.24 toolchain this project uses.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "repo=${{ github.repository }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $v for ${{ github.repository }}"

      - name: Ensure git tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git tag -a $tag -m "Remembrall ${{ steps.ver.outputs.version }}"
            git push origin $tag
          }

      - name: Bump CMake project version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $path = "CMakeLists.txt"
          $c = Get-Content $path -Raw
          $c = [regex]::Replace($c, 'project\(remembrall VERSION \d+\.\d+\.\d+', "project(remembrall VERSION $v")
          Set-Content $path $c -NoNewline

      - name: Download sherpa-onnx prebuilts
        shell: pwsh
        run: |
          .\scripts\download-sherpa.ps1 -Version 1.12.23

      - name: Configure
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName
          }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          $sherpa = (Resolve-Path "third_party\sherpa-onnx").Path
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DLTA_GITHUB_REPO=${{ steps.ver.outputs.repo }}" `
            "-DLTA_SHERPA_ROOT=$sherpa" `
            -DLTA_FETCH_SHERPA=OFF `
            -DLTA_BUILD_TESTS=ON `
            -DLTA_BUILD_CAPTURE_POC=OFF `
            -DWIL_BUILD_TESTS=OFF `
            -DWIL_BUILD_PACKAGING=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = Get-ChildItem -Path build -Recurse -Filter Remembrall.exe |
            Where-Object { $_.FullName -match "RelWithDebInfo" } |
            Select-Object -First 1
          if (-not $exe) { throw "Remembrall.exe not found" }
          $stage = "dist/Remembrall-$v"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName $stage
          Get-ChildItem $exe.Directory.FullName -Filter *.dll | Copy-Item -Destination $stage
          if (Test-Path assets/remembrall.png) { Copy-Item assets/remembrall.png $stage }
          @"
          Remembrall $v

          1. Start Remembrall.exe
          2. On first launch the speech model downloads automatically (~70 MB)
          3. Join a Discord voice call — live transcripts appear

          Updates: Remembrall checks GitHub Releases on ${{ github.repository }} for Remembrall-windows-x64*.zip
          "@ | Set-Content "$stage/GETTING_STARTED.txt"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/Remembrall-windows-x64-v$v.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Get-Item $zip | Format-List FullName, Length

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $v = "${{ steps.ver.outputs.version }}"
          $zip = "dist/Remembrall-windows-x64-v$v.zip"
          if (-not (Test-Path $zip)) { throw "Missing package $zip" }
          $notes = @"
          ## Remembrall $v

          Portable Windows x64 build.

          ### Install
          1. Unzip ``Remembrall-windows-x64-v$v.zip``
          2. Start ``Remembrall.exe`` — the speech model downloads automatically on first launch
          3. Join a Discord voice call

          ### Auto-update
          Installed copies check this repository's latest release for ``Remembrall-windows-x64*.zip``.
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
            gh release edit $tag --title "Remembrall $v" --notes $notes
          } else {
            gh release create $tag $zip --title "Remembrall $v" --notes $notes
          }
          Write-Host "Published https://github.com/${{ github.repository }}/releases/tag/$tag"
